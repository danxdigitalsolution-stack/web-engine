name: Build Qt WebEngine v6.11.2 Windows with Codecs

on:
  push:
    tags:
      - 'v*' # Otomatis berjalan jika Anda membuat tag versi baru (misal: v1.0.0)
  workflow_dispatch: # Memungkinkan tombol manual di tab Actions GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Wajib agar bot bisa mengunggah file ke tab GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools via Chocolatey
        run: |
          choco install ninja gperf bison flex nasm -y
          # Pastikan Node.js terinstal untuk engine Chromium
          choco install nodejs-lts -y

      - name: Install Qt Base SDK via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          # Mengunduh Qt Base 6.11.2 resmi untuk arsitektur Windows MSVC 2022 64-bit
          aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 -m qtwebengine

      - name: Clone Qt WebEngine Source v6.11.2
        shell: bash
        run: |
          # Melakukan clone repositori Qt WebEngine secara rekursif (untuk submodule Chromium internal)
          git clone https://qt.io --branch v6.11.2 --recursive --depth 1

      - name: Configure and Build Qt WebEngine (MSVC)
        shell: cmd
        run: |
          :: Mengaktifkan lingkungan compiler MSVC 2022 x64 Native secara otomatis
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          
          cd qtwebengine
          mkdir build && cd build
          
          :: Menentukan Path ke binary Qt SDK yang diinstal oleh aqt
          set "QT_DIR=%GITHUB_WORKSPACE%\Qt\6.11.2\msvc2022_64"
          set "PATH=%QT_DIR%\bin;%PATH%"
          
          :: Konfigurasi CMake dengan compiler MSVC dan flag Codec Proprietary (H.264, MP4, AAC)
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DQT_FEATURE_webengine_proprietary_codecs=ON ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\output"
          
          :: Mulai proses kompilasi (Sangat berat, Ninja otomatis mengoptimalkan core CPU)
          cmake --build .
          cmake --install .

      - name: Archive Windows Binaries
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE\output
          # Kompres hasil build menjadi file ZIP siap pakai
          Compress-Archive -Path * -DestinationPath ..\qtwebengine-windows-6.11.2-codecs.zip

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qtwebengine-windows-6.11.2-codecs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
