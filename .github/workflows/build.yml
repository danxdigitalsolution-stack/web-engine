name: Build Qt WebEngine 6.11.x Windows with Codecs

on:
  push:
    tags:
      - 'v*' # Otomatis berjalan jika Anda membuat tag versi baru (misal: v1.0.0)
  workflow_dispatch: # Memungkinkan tombol manual di tab Actions GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # Wajib agar bot bisa mengunggah file ke tab GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools via Chocolatey
        run: |
          choco install ninja gperf bison flex nasm -y
          # Pastikan Node.js terinstal untuk engine Chromium
          choco install nodejs-lts -y

      - name: Pin CMake to a known-good version
        uses: lukka/get-cmake@latest
        with:
          # windows-latest sekarang default bawa CMake 4.1+, yang punya regresi:
          # file(INSTALL) salah nge-flag artefak Qt (DLL/qmltypes) yang valid sebagai
          # "File exists" saat cmake --install (lihat forum.qt.io/topic/163162, dikonfirmasi
          # oleh Qt Company sendiri sebagai bug di CMake 4.1.1, bukan di project Qt-nya).
          # Pin ke 3.29.x yang belum kena bug ini.
          cmakeVersion: "3.29.6"

      - name: Install Qt Base SDK via aqtinstall
        shell: pwsh
        run: |
          # PyPI release 3.3.0 belum berisi fix untuk perubahan struktur folder Qt 6.11+
          # (lihat https://github.com/miurahr/aqtinstall/pull/1000, sudah merged ke master
          # tapi belum dirilis). Install langsung dari GitHub master sebagai workaround.
          pip install -U "git+https://github.com/miurahr/aqtinstall.git@master"
          # Cek versi 6.11.x apa saja yang benar-benar sudah dipublish di repo aqt
          aqt list-qt windows desktop --spec "6.11"
          # Mengunduh Qt Base terbaru dari seri 6.11 (tanpa -m qtwebengine karena kita build dari source)
          # PENTING: --outputdir di-set eksplisit ke "Qt" karena default aqt SEBENARNYA
          # adalah "./<version>/<arch>" (TANPA folder "Qt"), bukan "./Qt/<version>/<arch>"
          # seperti asumsi sebelumnya — itu yang bikin Get-ChildItem gagal nemuin folder Qt.
          aqt install-qt windows desktop 6.11 win64_msvc2022_64 --outputdir "$env:GITHUB_WORKSPACE\Qt"

          # PENTING: karena versinya "mengambang" (bisa 6.11.1, 6.11.2, 6.11.3, dst
          # tergantung patch terbaru yang tersedia saat build jalan), kita HARUS
          # deteksi folder hasil install secara dinamis alih-alih hardcode path.
          # Hardcode path di sini adalah penyebab error "Could not find Qt6" kemarin.
          $qtVersionDir = Get-ChildItem "$env:GITHUB_WORKSPACE\Qt" -Directory |
            Where-Object { $_.Name -match '^6\.11\.\d+$' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $qtVersionDir) { throw "Gagal mendeteksi folder versi Qt hasil instalasi aqt" }

          $qtDir = Join-Path $qtVersionDir.FullName "msvc2022_64"
          if (-not (Test-Path $qtDir)) { throw "Folder toolchain Qt tidak ditemukan: $qtDir" }

          Write-Host "Qt terinstall di: $qtDir (versi $($qtVersionDir.Name))"

          # Simpan sebagai env var supaya step-step berikutnya (termasuk shell cmd)
          # tidak perlu menebak-nebak path lagi.
          "QT_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QT_VERSION=$($qtVersionDir.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$qtDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Cache Qt WebEngine source
        id: cache-qtwebengine
        uses: actions/cache@v4
        with:
          path: qtwebengine
          # Key mengikuti versi Qt yang benar-benar terinstall, jadi cache otomatis
          # invalidate kalau patch Qt naik (misal dari 6.11.2 ke 6.11.3).
          key: qtwebengine-src-${{ env.QT_VERSION }}-${{ runner.os }}

      - name: Clone Qt WebEngine Source
        if: steps.cache-qtwebengine.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Clone tag WebEngine yang PERSIS sama dengan versi Qt Base yang terinstall,
          # supaya tidak ada mismatch versi antara qtbase dan qtwebengine.
          git clone https://code.qt.io/qt/qtwebengine.git --branch "v${QT_VERSION}" --recursive --depth 1

      - name: Configure and Build Qt WebEngine (MSVC)
        shell: cmd
        run: |
          :: Mengaktifkan lingkungan compiler MSVC 2022 x64 Native secara otomatis
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"

          :: PENTING: folder build sengaja ditaruh DI LUAR "qtwebengine" (yang di-cache)
          :: supaya artefak build/install tidak pernah ikut ke-cache bareng source.
          :: Dulu build/ ada di dalam qtwebengine/, jadi kalau ada run yang gagal
          :: di tengah proses, actions/cache tetap menyimpan state parsialnya (post-step
          :: cache tetap jalan meski job gagal) dan bikin run berikutnya nabrak
          :: "cmake --install" ("File exists") karena mencoba menimpa file yang sudah ada.
          if exist build rmdir /s /q build
          mkdir build
          cd build

          :: QT_DIR sudah di-set sebagai env var di step "Install Qt Base SDK via aqtinstall"
          set "PATH=%QT_DIR%\bin;%PATH%"

          :: Konfigurasi CMake dengan compiler MSVC dan flag Codec Proprietary (H.264, MP4, AAC)
          :: CMAKE_PREFIX_PATH di-set eksplisit karena find_package(Qt6) butuh ini,
          :: sekadar menaruh qmake di PATH saja tidak cukup untuk CMake Config mode.
          cmake ..\qtwebengine -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%QT_DIR%" ^
            -DQT_FEATURE_webengine_proprietary_codecs=ON ^
            -DQT_FEATURE_qtpdf_build=OFF ^            
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\output"

          :: Throttle parallelism to prevent runner memory exhaustion
          cmake --build . --parallel 4
          cmake --install .

      - name: Archive Windows Binaries
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE\output
          # Kompres hasil build menjadi file ZIP siap pakai
          Compress-Archive -Path * -DestinationPath ..\qtwebengine-windows-$env:QT_VERSION-codecs.zip

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qtwebengine-windows-${{ env.QT_VERSION }}-codecs.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
